<html>
<head>
<script>

	
function vibrateTimestamps(timestamps) {
console.log(234);
  const timers = [];

  timestamps.forEach(([start, end]) => {
    const delay = Math.round(start * 1000);
    const duration = Math.round((end - start) * 1000);

    timers.push(setTimeout(() => {
      navigator.vibrate(duration);
    }, delay));
  });

  return () => {
    timers.forEach(clearTimeout);
    navigator.vibrate(0);
  };
}

const timestamps = [
  [10.255, 12.385],
  [12.980, 14.935],
  [15.562, 17.519],
  [18.145, 19.220],
  [19.433, 19.970],
  [20.715, 22.699],
  [23.304, 25.260],
  [25.885, 27.840],
  [28.466, 29.745]
];

const stopVibration = vibrateTimestamps(timestamps);
</script>
</head>
<body>
 <button onclick="vibrateTimestamps(timestamps)">Vibr</button>

</body>

</html>
