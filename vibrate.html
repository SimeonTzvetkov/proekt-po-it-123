<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>

	
const timestamps = [
  [10.255, 12.385],
  [12.980, 14.935],
  [15.562, 17.519],
  [18.145, 19.220],
  [19.433, 19.970],
  [20.715, 22.699],
  [23.304, 25.260],
  [25.885, 27.840],
  [28.466, 29.745]
];

function vibrateTimestamps(timestamps) {
  const pattern = [1];

  let previousEnd = 0;

  for (const [start, end] of timestamps) {
    const pause = Math.round((start - previousEnd) * 1000);
    const duration = Math.round((end - start) * 1000);

    pattern.push(Math.max(0, pause - (previousEnd === 0 ? 1 : 0)));
    pattern.push(duration);

    previousEnd = end;
  }
  console.log(pattern);

  return navigator.vibrate(pattern);
}

</script>
</head>
<body>
 <button onclick="vibrateTimestamps(timestamps)">Vibrate</button>

</body>

</html>
