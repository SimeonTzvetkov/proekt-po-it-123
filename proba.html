<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone Light Show</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { color-scheme: light only; --bg:#0e0f13; --panel:#181a21; --line:#2b2e39; --text:#eceef4; --dim:#8b90a0; --accent:#fff; --ok:#6ee7a0; --bad:#ff7a7a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 20px 40px; }
  h1 { font-size:1.6rem; margin:0 0 4px; letter-spacing:-.01em; }
  p.sub { margin:0 0 24px; color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  button, input[type=file]::file-selector-button {
    font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 18px;
    background:var(--accent); color:#000; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:focus-visible, input:focus-visible { outline:2px solid #7cb7ff; outline-offset:2px; }
  .big { width:100%; padding:20px; font-size:1.2rem; }
  #audio { width:100%; max-height:55vh; margin-top:12px; background:#000; border-radius:8px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dim { color:var(--dim); }
  #qr { background:#fff; padding:10px; border-radius:8px; display:inline-block; }
  #qr:empty { display:none; }
  code { word-break:break-all; font-size:.85rem; color:var(--dim); }
  #count { font-weight:700; font-size:1.4rem; }
  #status { min-height:1.5em; }
  /* phone light */
  video.blackout { filter: brightness(0); }
  #clip { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; display:none; visibility:hidden; pointer-events:none; z-index:11; }
  body.running #clip { display:block; }
  body.running #clip.on { visibility:visible; }
  #light { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; display:none; z-index:10; forced-color-adjust:none; }
  body.running #light { display:block; }
  body.running .wrap { visibility:hidden; }
  body.running { background:#000; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto; } }
</style>
</head>
<body>
<canvas id="light" width="1" height="1"></canvas>
<video id="clip" muted playsinline preload="auto" disablepictureinpicture></video>
<div class="wrap" id="app"></div>

<script>
/* ============ CONFIG ============ */
const TIMESTAMPS = [
  [10.255, 12.385],
  [12.980, 14.935],
  [15.562, 17.519],
  [18.145, 19.220],
  [19.433, 19.970],
  [20.078, 20.600],
  [20.715, 22.699],
  [23.304, 25.260],
  [25.885, 27.840],
  [28.466, 29.745],

  [60+12.322, 60+14.300],
  [60+14.915, 60+16.840],
  [60+17.495, 60+19.450],
  [60+20.072, 60+21.085],
  [60+21.368, 60+21.860],
  [60+22.005, 60+22.500],
  [60+22.653, 60+24.620],
  [60+25.239, 60+27.190],
  [60+27.819, 60+29.770],
  [60+30.400, 60+31.620],
  [60+31.692, 60+32.265],
  [60+32.330, 60+32.550]
];
const FLASH_MS = 50;      // full brightness
const FADE_MS  = 1950;    // then fade to black
// Extra quick white flashes: 120 ms fade-in -> 50 ms peak -> 450 ms fade-out.
// Times are where the PEAK starts, snapped to the transients found in song.opus (93 BPM, one beat = 0.645 s).
// Your original times were: 123.990, 124.600, 125.270, 125.950, 126.600, 127.250, 127.900
const FLASH_PEAKS = [
  123.904, 124.551, 125.205, 125.850, 126.502, 127.145, 127.790,   // 2:03-2:08
  134.228, 134.836, 135.486, 136.154, 136.823, 137.433, 138.050    // 2:14-2:18 (bridge)
];
const FLASH_CHANCE = 0.5;                 // every device flips a coin per flash: ~half the phones flash each time
const FLASH_BLUE = [80, 165, 215];        // calm watery blue, picked from the video's teal/blue palette
// flashes 1-2 white, 3-4 transitional (1/3 and 2/3 of the way), 5 onwards full blue
const FLASH_COLORS = FLASH_PEAKS.map((_, i) => {
  const k = i < 2 ? 0 : i < 4 ? (i - 1) / 3 : 1;
  return [0, 1, 2].map((c) => Math.round(255 + (FLASH_BLUE[c] - 255) * k));
});

/* ---- Chaotic lights for the two dynamic parts ---- */
const CHAOS_SECTIONS = [          // [start, end, fade-out end]
  [95.561, 112.330, 112.620],     // 1:35.561 - 1:52.330
  [113.620, 122.665, 122.950]     // 1:53.620 - 2:02.665
];
// Hits detected in the audio (kick/snare/hats merged): [time, weight 1 = weak, 2 = medium, 3 = strong]
const CHAOS_HITS = [
  [95.561,3], [95.689,1], [95.782,1], [95.898,1], [96.007,3], [96.096,1], [96.194,2], [96.310,1],
  [96.495,3], [96.620,2], [96.802,3], [96.972,1], [97.143,3], [97.299,2], [97.373,1], [97.466,3],
  [97.605,1], [97.657,1], [97.802,1], [97.948,3], [98.117,3], [98.307,1], [98.365,1], [98.423,1],
  [98.487,1], [98.594,3], [98.766,1], [98.923,1], [99.064,3], [99.161,1], [99.216,1], [99.312,1],
  [99.385,2], [99.480,1], [99.581,3], [99.738,3], [99.880,1], [99.938,1], [100.040,2], [100.184,3],
  [100.352,2], [100.515,3], [100.699,3], [100.834,1], [100.990,2], [101.161,3], [101.233,1], [101.314,1],
  [101.372,1], [101.494,1], [101.593,1], [101.671,3], [101.809,3], [101.889,1], [101.982,3], [102.152,2],
  [102.284,1], [102.380,1], [102.539,1], [102.631,3], [102.789,1], [102.870,1], [102.971,1], [103.071,2],
  [103.251,3], [103.323,1], [103.398,1], [103.497,1], [103.613,1], [103.756,3], [103.929,1], [104.112,1],
  [104.233,3], [104.327,1], [104.396,2], [104.560,2], [104.736,2], [104.883,3], [105.041,1], [105.106,1],
  [105.202,3], [105.360,1], [105.519,2], [105.699,2], [105.849,3], [106.011,2], [106.080,1], [106.214,1],
  [106.335,3], [106.429,2], [106.540,1], [106.677,2], [106.816,3], [106.996,2], [107.089,2], [107.148,1],
  [107.369,1], [107.467,3], [107.601,2], [107.677,1], [107.776,3], [107.851,1], [107.944,1], [108.108,2],
  [108.164,1], [108.243,3], [108.438,3], [108.541,1], [108.678,2], [108.812,2], [108.911,3], [109.062,2],
  [109.180,1], [109.232,1], [109.285,1], [109.395,2], [109.453,1], [109.546,2], [109.770,1], [109.892,2],
  [110.037,2], [110.231,1], [110.372,3], [110.469,1], [110.527,1], [110.701,1], [110.840,1], [110.939,1],
  [111.018,3], [111.164,2], [111.272,2], [111.374,2], [111.505,3], [111.612,1], [111.674,3], [111.802,2],
  [111.948,3], [112.114,1], [112.216,1], [112.340,1], [113.620,3], [113.713,1], [113.847,1], [113.936,2],
  [114.074,3], [114.183,2], [114.372,2], [114.551,3], [114.651,2], [114.753,1], [114.892,2], [115.017,3],
  [115.113,1], [115.196,3], [115.353,2], [115.529,3], [115.653,2], [115.769,1], [115.850,1], [115.920,1],
  [116.007,1], [116.084,2], [116.184,3], [116.285,1], [116.383,2], [116.496,2], [116.599,1], [116.673,3],
  [116.792,2], [116.895,1], [116.982,2], [117.139,3], [117.237,1], [117.301,2], [117.377,1], [117.495,2],
  [117.639,1], [117.787,3], [117.899,1], [118.009,1], [118.125,3], [118.242,1], [118.320,2], [118.436,2],
  [118.599,2], [118.761,3], [118.845,1], [118.944,1], [119.056,2], [119.238,3], [119.414,1], [119.578,3],
  [119.721,3], [119.844,1], [119.911,1], [119.995,1], [120.104,3], [120.233,3], [120.378,3], [120.476,2],
  [120.682,3], [120.804,2], [120.947,1], [121.031,2], [121.227,3], [121.332,2], [121.404,2], [121.531,2],
  [121.661,2], [121.827,3], [121.945,2], [122.055,1], [122.146,2], [122.288,3], [122.447,2], [122.613,2]
];
const CHAOS_PROB = [0, 0.35, 0.55, 0.85];    // chance that a device reacts to a hit of weight 1 / 2 / 3
const CHAOS_STUTTER = 0.2;                    // chance of a quick double-flash after a hit
const CHAOS_SPARKS_PER_SEC = 3;               // extra random strobes that are not on any beat
const CHAOS_COLORS = [                        // r, g, b, weight
  [255, 255, 255, 4], [80, 165, 215, 3], [150, 120, 255, 1.5], [255, 90, 170, 1.5]
];
// Every device builds its own random pattern (so no two phones are alike) each time the song starts or is sought.
function buildChaos() {
  const total = CHAOS_COLORS.reduce((a, c) => a + c[3], 0);
  const pick = () => { let r = Math.random() * total; for (const c of CHAOS_COLORS) if ((r -= c[3]) < 0) return c; return CHAOS_COLORS[0]; };
  const ev = [];
  for (const [t, w] of CHAOS_HITS) {
    if (Math.random() > CHAOS_PROB[w]) continue;
    const d = (60 + Math.random() * 80 + w * 35) / 1000, p = 0.55 + Math.random() * 0.45;
    ev.push({ t, d, p, c: pick() });
    if (Math.random() < CHAOS_STUTTER) ev.push({ t: t + 0.06 + Math.random() * 0.04, d: d * 0.7, p: p * 0.8, c: pick() });
  }
  for (const [s0, s1] of CHAOS_SECTIONS) {
    const n = Math.round((s1 - s0) * CHAOS_SPARKS_PER_SEC);
    for (let i = 0; i < n; i++) ev.push({ t: s0 + Math.random() * (s1 - s0), d: 0.03 + Math.random() * 0.04, p: 0.4 + Math.random() * 0.6, c: pick() });
  }
  return ev;
}
function chaosMask(t) {                      // 1 inside a section, linear fade-out afterwards, 0 elsewhere
  for (const [s0, s1, fe] of CHAOS_SECTIONS) {
    if (t >= s0 && t <= s1) return 1;
    if (t > s1 && t < fe) return (fe - t) / (fe - s1);
  }
  return 0;
}
const FL_IN = 0.120, FL_PEAK = 0.050, FL_OUT = 0.450;
const quickFlash = (a) => a < -FL_IN ? 0 : a < 0 ? 1 + a / FL_IN : a < FL_PEAK ? 1 : a < FL_PEAK + FL_OUT ? 1 - (a - FL_PEAK) / FL_OUT : 0;
const FPS = 24;
const CLIP_START = 4461 / FPS;   // 185.875 s: the video frame where the fire clip starts
const CLIP_DUR   = 496 / FPS;    // 20.667 s
const CLIP_WIDTHS = [1366, 1440, 1600, 1920];
const CLIP_SRC = 'vid/fire-' + (CLIP_WIDTHS.includes(screen.width) ? screen.width : 1920) + '.mp4'; // relative path works on GitHub project pages
const FW = 45, FH = 96;          // low-res canvas; fire is drawn here and scaled to the full screen
const deviceParam = new URLSearchParams(location.search).get('device'); // ?device=pc or ?device=phone to test
const IS_COMPUTER = deviceParam ? deviceParam === 'pc' :
  !(/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) ||
    (navigator.userAgentData && navigator.userAgentData.mobile) ||
    (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)));
const LATE_TOLERANCE = 0.5; // s: cues missed by more than this are skipped after a (re)sync
/* ================================ */

const $ = (s) => document.querySelector(s);
const app = $('#app');
const room = new URLSearchParams(location.search).get('room');
room ? startPhone(room) : startCoordinator();

/* ============ COORDINATOR ============ */
function startCoordinator() {
  const id = 'lightshow-' + Math.random().toString(36).slice(2, 7);
  const joinUrl = location.origin + location.pathname + '?room=' + id;
  app.innerHTML = `
    <h1>Light show coordinator</h1>
    <p class="sub">Phones join, you pick a track, the track plays here.</p>
    <div class="panel">
      <div class="row"><span id="count">0</span><span class="dim">phones connected</span></div>
      <p id="status" class="dim">Connecting to PeerJS…</p>
      <div id="qr"></div>
      <p><code id="url"></code></p>
    </div>
    <div class="panel">
      <input type="file" id="file" accept="audio/*,video/*">
      <video id="audio" controls playsinline></video>
      <div class="row" style="margin-top:12px"><button class="ghost" id="fs">Fullscreen video</button></div>
    </div>
    <div class="panel">
      <label for="delay">Light delay (ms) – raise it if your speakers lag behind the lights</label>
      <div class="row"><input type="range" id="delay" min="-300" max="800" step="10" value="0" style="flex:1"><span id="delayv">0</span></div>
      <div class="row" style="margin-top:12px"><button class="ghost" id="test">Test flash</button><button class="ghost" id="resync">Resync clocks</button></div>
    </div>`;
  $('#url').textContent = joinUrl;

  const audio = $('#audio');
  const conns = new Set();
  let delay = 0;
  const peer = new Peer(id);

  peer.on('open', () => {
    $('#status').textContent = 'Ready. Scan the code or open the link on each phone.';
    try { new QRCode($('#qr'), { text: joinUrl, width: 180, height: 180 }); } catch (e) {}
  });
  peer.on('error', (e) => { $('#status').textContent = 'PeerJS error: ' + e.type; });

  const send = (msg) => conns.forEach((c) => c.open && c.send(msg));
  const rawT0 = () => performance.now() - audio.currentTime * 1000 / audio.playbackRate;
  // currentTime is only refreshed in chunks, so a stale read makes T0 too late, never too early.
  // Record an estimate only when currentTime actually changed and use the minimum of the recent ones.
  let est = [], lastCT = -1;
  (function tick() {
    const ct = audio.currentTime;
    audio.classList.toggle('blackout', ct >= CLIP_START - 0.0005 && ct < CLIP_START + CLIP_DUR);
    if (audio.paused) { est = []; lastCT = -1; }
    else if (audio.currentTime !== lastCT) {
      lastCT = audio.currentTime; est.push(rawT0());
      if (est.length > 30) est.shift();
    }
    requestAnimationFrame(tick);
  })();
  const T0 = () => est.length >= 5 ? Math.min(...est) : rawT0();
  const state = () => ({ type: 'state', playing: !audio.paused && !audio.ended, T0: T0() });
  const config = () => ({ type: 'config', timestamps: TIMESTAMPS, flash: FLASH_MS, fade: FADE_MS, delay, flashes: FLASH_PEAKS });

  peer.on('connection', (c) => {
    c.on('open', () => {
      conns.add(c);
      $('#count').textContent = conns.size;
      c.send(config());
      c.send(state());
    });
    c.on('data', (m) => {
      if (m && m.type === 'ping') c.send({ type: 'pong', t0: m.t0, th: performance.now() });
    });
    const gone = () => { conns.delete(c); $('#count').textContent = conns.size; };
    c.on('close', gone); c.on('error', gone);
  });

  $('#file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) { audio.src = URL.createObjectURL(f); }
  });
  ['playing', 'pause', 'seeked', 'ended', 'ratechange'].forEach((ev) =>
    audio.addEventListener(ev, () => {
      if (ev === 'seeked' || ev === 'ratechange') { est = []; lastCT = -1; }
      send(state());
      if (ev === 'playing' || ev === 'seeked') { setTimeout(() => send(state()), 400); setTimeout(() => send(state()), 1200); }
    }));
  setInterval(() => { if (!audio.paused) send(state()); }, 2000); // drift correction

  $('#delay').addEventListener('input', (e) => {
    delay = +e.target.value; $('#delayv').textContent = delay; send(config());
  });
  $('#fs').addEventListener('click', () => (audio.requestFullscreen || audio.webkitRequestFullscreen).call(audio));
  $('#test').addEventListener('click', () => send({ type: 'test' }));
  $('#resync').addEventListener('click', () => send({ type: 'resync' }));
}

/* ============ PHONE ============ */
function startPhone(roomId) {
  app.innerHTML = `
    <h1>Light show</h1>
    <p class="sub">Keep this screen on and turn the volume of your phone off – the sound comes from the main speakers.</p>
    <button class="big" id="go">Go fullscreen &amp; start</button>
    <p id="status" class="dim">Connecting…</p>
    <div class="panel">
      <label for="trim">Fine-tune this phone (ms, positive = later)</label>
      <div class="row"><input type="number" id="trim" value="0" step="10" style="width:6em"><span id="sync" class="dim"></span></div>
    </div>`;
  const status = (t, ok) => { const s = $('#status'); s.textContent = t; s.style.color = ok ? 'var(--ok)' : ''; };
  const light = $('#light'), ctx = light.getContext('2d');
  const clip = $('#clip');
  light.width = FW; light.height = FH;
  if (IS_COMPUTER) { clip.muted = true; clip.src = CLIP_SRC; clip.load(); }
  function updateClip(t) {
    if (!IS_COMPUTER) return;
    const ct = t === null ? -1 : t - CLIP_START;
    if (ct >= 0 && ct < CLIP_DUR) {
      clip.classList.add('on');
      if (clip.paused) { clip.currentTime = ct; clip.play().catch(() => {}); }
      else if (!clip.seeking) {
        const diff = ct - clip.currentTime;                 // >0: video is behind
        if (Math.abs(diff) > 0.4) clip.currentTime = ct;    // big error: jump
        else clip.playbackRate = Math.abs(diff) < 0.03 ? 1 : 1 + Math.max(-0.1, Math.min(0.1, diff)); // small error: gently speed up/slow down
      }
    } else {
      clip.classList.remove('on');
      if (!clip.paused) clip.pause();
      if (clip.currentTime !== 0 && !clip.seeking) { clip.currentTime = 0; clip.playbackRate = 1; }
    }
  }

  let cfg = { timestamps: TIMESTAMPS, flash: FLASH_MS, fade: FADE_MS, delay: 0 };
  let offset = 0;                 // hostTime = localTime + offset
  let samples = [];               // recent {rtt, off} clock samples
  let T0 = null;                  // host-clock time at which media time was 0
  let fired = new Set();          // cues whose vibration was already triggered
  let testStart = -1e9;
  let flashOn = [], chaos = [];
  const rollFlashes = () => { flashOn = FLASH_PEAKS.map(() => Math.random() < FLASH_CHANCE); chaos = buildChaos(); };
  rollFlashes();
  let conn = null, wakeLock = null;
  let trim = 0;
  try { trim = +localStorage.getItem('trim') || 0; $('#trim').value = trim; } catch (e) {}
  $('#trim').addEventListener('input', (e) => {
    trim = +e.target.value || 0;
    try { localStorage.setItem('trim', trim); } catch (err) {}
  });

  /* --- clock sync: keep the fastest 25% of the last 30 round trips, take their median offset --- */
  function addSample(rtt, off) {
    samples.push({ rtt, off });
    if (samples.length > 30) samples.shift();
    const best = [...samples].sort((a, b) => a.rtt - b.rtt).slice(0, Math.max(3, Math.ceil(samples.length / 4)));
    const offs = best.map((x) => x.off).sort((a, b) => a - b);
    offset = offs[Math.floor(offs.length / 2)];
    $('#sync').textContent = 'link ' + Math.round(best[0].rtt) + ' ms, ' + samples.length + ' samples';
  }
  const synced = () => samples.length >= 5;
  function ping() { if (conn && conn.open && !document.hidden) conn.send({ type: 'ping', t0: performance.now() }); }
  function burst(n = 20, spread = 400) { for (let i = 0; i < n; i++) setTimeout(ping, Math.random() * spread + i * 70); }
  setInterval(ping, 2500 + Math.random() * 1000);

  function connect() {
    const peer = new Peer();
    const retry = (msg, ms) => { status(msg); setTimeout(() => { try { peer.destroy(); } catch (e) {} connect(); }, ms); };
    peer.on('open', () => {
      conn = peer.connect(roomId, { reliable: true });
      conn.on('open', () => { status('Connected. Tap the button.', true); samples = []; burst(); });
      conn.on('data', onData);
      conn.on('close', () => retry('Disconnected. Retrying…', 1500));
    });
    peer.on('error', () => retry('Connection problem. Retrying…', 2000));
  }

  function onData(m) {
    if (m.type === 'pong') {
      const t1 = performance.now(), rtt = t1 - m.t0;
      addSample(rtt, m.th + rtt / 2 - t1);
    } else if (m.type === 'config') {
      cfg = m;
    } else if (m.type === 'resync') {
      samples = []; burst(20, 4000);
    } else if (m.type === 'state') {
      if (!m.playing) { T0 = null; fired.clear(); if (navigator.vibrate) navigator.vibrate(0); return; }
      if (T0 === null || Math.abs(m.T0 - T0) > 250) {   // start or seek: re-arm cues
        T0 = m.T0; fired.clear(); rollFlashes();
        const t = mediaTime();
        cfg.timestamps.forEach(([st], i) => { if (st < t - LATE_TOLERANCE) fired.add(i); });
      } else if (Math.abs(m.T0 - T0) > 40) {
        T0 = m.T0;                                      // real error: correct immediately
      } else {
        T0 += (m.T0 - T0) * 0.25;                       // smooth tiny jitter only
      }
    } else if (m.type === 'test') {
      testStart = performance.now();
    }
  }

  const mediaTime = () => (performance.now() + offset - T0 - cfg.delay - trim) / 1000;
  const env = (ageMs) => ageMs < 0 ? 0 : ageMs < cfg.flash ? 1 : ageMs < cfg.flash + cfg.fade ? 1 - (ageMs - cfg.flash) / cfg.fade : 0;

  /* --- fire (phones): classic "Doom fire" heat grid, different on every device, only start/end are shared --- */
  const heat = new Uint8Array(FW * FH);
  const img = ctx.createImageData(FW, FH);
  const pal = [];
  for (let i = 0; i <= 36; i++) {
    const f = i / 36, c = (x) => Math.max(0, Math.min(255, Math.round(x)));
    pal.push([c(f * 3 * 255), c((f - 0.33) * 3 * 255), c((f - 0.72) * 3.5 * 255)]);
  }
  let fireActive = false, fireAcc = 0, fireLast = 0;
  function fireStep(src) {
    for (let x = 0; x < FW; x++) heat[(FH - 1) * FW + x] = src;
    for (let y = 1; y < FH; y++) for (let x = 0; x < FW; x++) {
      const i = y * FW + x, v = heat[i];
      if (!v) { heat[i - FW] = 0; continue; }
      const r = (Math.random() * 3) | 0;
      heat[i - r + 1 - FW] = v - (r & 1);
    }
  }
  function drawFire(ft) {                               // ft = seconds since the fire started
    const now = performance.now();
    if (!fireActive) {
      fireActive = true; fireLast = now; heat.fill(0);
      if (ft < 0.5 && navigator.vibrate) {              // random crackle for the duration of the fire
        const pat = []; let sum = 0, total = (CLIP_DUR - ft) * 1000;
        while (sum < total) { const on = 20 + Math.random() * 90, off = 40 + Math.random() * 180; pat.push(Math.round(on), Math.round(off)); sum += on + off; }
        navigator.vibrate(pat);
      }
    }
    fireAcc += now - fireLast; fireLast = now;
    const env = Math.min(1, ft / 1.5) * Math.min(1, (CLIP_DUR - ft) / 3);  // fade in 1.5 s, die down over the last 3 s
    while (fireAcc >= 33) { fireAcc -= 33; fireStep(Math.round(36 * env)); }
    const d = img.data;
    for (let i = 0; i < heat.length; i++) { const c = pal[heat[i]], o = i * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }
    ctx.putImageData(img, 0, 0);
  }

  function frame() {
    const tNow = T0 !== null && synced() ? mediaTime() : null;
    updateClip(tNow);
    if (!IS_COMPUTER && tNow !== null && tNow >= CLIP_START && tNow < CLIP_START + CLIP_DUR) {
      drawFire(tNow - CLIP_START);
      requestAnimationFrame(frame);
      return;
    }
    fireActive = false;
    let b = 0, col = [255, 255, 255];
    if (T0 !== null && synced()) {
      const t = mediaTime();
      let last = -1;
      cfg.timestamps.forEach(([st, en], i) => {
        if (st <= t) last = st;                         // latest started cue wins (overlap cancels older fade)
        if (!fired.has(i) && st <= t) {
          fired.add(i);
          if (t - st < LATE_TOLERANCE && navigator.vibrate) navigator.vibrate(Math.max(1, Math.round((en - t) * 1000)));
        }
      });
      if (last >= 0) b = env((t - last) * 1000);        // brightness is a pure function of media time
      FLASH_PEAKS.forEach((pk, i) => {
        if (!flashOn[i]) return;
        const f = quickFlash(t - pk);
        if (f > b) { b = f; col = FLASH_COLORS[i]; }   // brightest effect decides the colour
      });
      const cm = chaosMask(t);
      if (cm > 0) for (const e of chaos) {
        const a = t - e.t;
        if (a < 0 || a > e.d) continue;
        const f = e.p * cm * (1 - a / e.d) ** 2;
        if (f > b) { b = f; col = e.c; }
      }
    }
    const tf = env(performance.now() - testStart);
    if (tf > b) { b = tf; col = [255, 255, 255]; }
    ctx.fillStyle = `rgb(${Math.round(col[0] * b)},${Math.round(col[1] * b)},${Math.round(col[2] * b)})`;
    ctx.fillRect(0, 0, FW, FH);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  $('#go').addEventListener('click', async () => {
    const el = document.documentElement;
    try { await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(1);        // user-gesture unlock for vibration
    if (IS_COMPUTER) clip.play().then(() => { clip.pause(); clip.currentTime = 0; }).catch(() => {}); // unlock + preload the clip
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    document.body.classList.add('running');
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('running');
  });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      burst(8);
      if (document.body.classList.contains('running')) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
    }
  });
  let lastTap = 0;                                       // double-tap the black screen to leave
  document.body.addEventListener('click', () => {
    if (!document.body.classList.contains('running')) return;
    const n = Date.now();
    if (n - lastTap < 400) { document.exitFullscreen?.(); document.body.classList.remove('running'); }
    lastTap = n;
  });

  connect();
}
</script>
</body>
</html>
