<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone Light Show</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { color-scheme: light only; --bg:#0e0f13; --panel:#181a21; --line:#2b2e39; --text:#eceef4; --dim:#8b90a0; --accent:#fff; --ok:#6ee7a0; --bad:#ff7a7a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 20px 40px; }
  h1 { font-size:1.6rem; margin:0 0 4px; letter-spacing:-.01em; }
  p.sub { margin:0 0 24px; color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  button, input[type=file]::file-selector-button {
    font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 18px;
    background:var(--accent); color:#000; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:focus-visible, input:focus-visible { outline:2px solid #7cb7ff; outline-offset:2px; }
  .big { width:100%; padding:20px; font-size:1.2rem; }
  #audio { width:100%; max-height:55vh; margin-top:12px; background:#000; border-radius:8px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dim { color:var(--dim); }
  #qr { background:#fff; padding:10px; border-radius:8px; display:inline-block; }
  #qr:empty { display:none; }
  code { word-break:break-all; font-size:.85rem; color:var(--dim); }
  .n { font-weight:700; font-size:1.4rem; }
  .row { column-gap:20px; }
  select, .num { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  #status { min-height:1.5em; }
  /* phone light */
  video.blackout { filter: brightness(0); }
  #clip { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; display:none; visibility:hidden; pointer-events:none; z-index:11; }
  body.running #clip { display:block; }
  body.running #clip.on { visibility:visible; }
  #light { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; display:none; z-index:10; forced-color-adjust:none; }
  body.running #light { display:block; }
  body.running .wrap { visibility:hidden; }
  body.running { background:#000; }
  body.running, body.running * { cursor:none; }   /* fullscreen on a computer client: no mouse pointer over the show */
  video.idle { cursor:none; }                      /* coordinator's fullscreen video: pointer hides when the mouse rests */
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto; } }
</style>
</head>
<body>
<canvas id="light" width="1" height="1"></canvas>
<video id="clip" muted playsinline preload="auto" disablepictureinpicture></video>
<div class="wrap" id="app"></div>

<script>
/* ============ CONFIG ============ */

const FLASH_MS = 50;      // full brightness
const FADE_MS  = 1950;    // then fade to black
// Extra quick white flashes: 120 ms fade-in -> 50 ms peak -> 450 ms fade-out.
// Times are where the PEAK starts, snapped to the transients found in song.opus (93 BPM, one beat = 0.645 s).
// Your original times were: 123.990, 124.600, 125.270, 125.950, 126.600, 127.250, 127.900
const FLASH_PEAKS = [
  123.904, 124.551, 125.205, 125.850, 126.502, 127.145, 127.790,   // 2:03-2:08
  134.228, 134.836, 135.486, 136.154, 136.823, 137.433, 138.050    // 2:14-2:18 (bridge)

  const k = i < 2 ? 0 : i < 4 ? (i - 1) / 3 : 1;
  return [0, 1, 2].map((c) => Math.round(255 + (FLASH_BLUE[c] - 255) * k));

/* ---- Flowing colour pulses for the two dynamic parts (follow the main beat) ---- */
const CHAOS_SECTIONS = [          // [start, end, fade-out end]
  [95.561, 112.330, 112.620],     // 1:35.561 - 1:52.330
  [113.620, 122.665, 122.950]     // 1:53.620 - 2:02.665
];
// The main beat found in the audio: six beats per bar, every 3 sixteenth-notes (about 0.48 s). [time, position in bar; 0 = downbeat]
const MAIN_BEATS = [
  [95.561,0], [96.009,3], [96.496,6], [96.972,9], [97.477,12], [97.953,15],
  [98.133,0], [98.603,3], [99.074,6], [99.579,9], [100.043,12], [100.519,15],
  [100.687,0], [101.169,3], [101.680,6], [102.156,9], [102.644,12], [103.096,15],
  [103.265,0], [103.764,3], [104.252,6], [104.733,9], [105.204,12], [105.709,15],
  [105.854,0], [106.341,3], [106.817,6], [107.299,9], [107.781,12], [108.263,15],
  [108.431,0], [108.913,3], [109.395,6], [109.888,9], [110.364,12], [110.840,15],
  [111.009,0], [111.496,3], [111.978,6], [113.620,0], [114.074,3], [114.567,6],
  [115.031,9], [115.525,12], [116.007,15], [116.169,0], [116.657,3], [117.144,6],
  [117.615,9], [118.114,12], [118.590,15], [118.752,0], [119.234,3], [119.716,6],
  [120.198,9], [120.686,12], [121.167,15], [121.330,0], [121.817,3], [122.299,6]
];
const PULSE_ATTACK = 0.06, PULSE_HOLD = 0.03, PULSE_DECAY = 0.40;   // seconds: soft rise, short peak, long glowing fade
const PULSE_LEN = PULSE_ATTACK + PULSE_HOLD + PULSE_DECAY;
const PULSE_PROB_DOWN = 1.0;      // chance a device pulses on a bar's downbeat
const PULSE_PROB = 0.75;          // ... and on the other beats
const hsl = (H, S, L) => {        // degrees, 0-1, 0-1 -> [r, g, b]
  H = ((H % 360) + 360) % 360;
  const a = S * Math.min(L, 1 - L);
  const f = (n) => { const k = (n + H / 30) % 12; return L - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)].map((v) => Math.round(v * 255));
};
const pulseEnv = (a) => {         // 0 -> 1 -> 0 over PULSE_LEN seconds
  if (a < 0) return 0;
  if (a < PULSE_ATTACK) { const x = a / PULSE_ATTACK; return x * x * (3 - 2 * x); }
  if (a < PULSE_ATTACK + PULSE_HOLD) return 1;
  const u = (a - PULSE_ATTACK - PULSE_HOLD) / PULSE_DECAY;
  return u < 1 ? (1 - u) * (1 - u) : 0;
};
// Each device builds its own pattern when the song starts or is sought: the crowd forms a drifting band of
// cool colours (teal -> blue -> violet) with pale accents on downbeats and a few rare pink sparks.
function buildChaos() {
  const spread = (Math.random() - 0.5) * 100;      // this device's place in the colour band
  const ev = [];
  for (const [t, pos] of MAIN_BEATS) {
    const down = pos === 0;
    if (Math.random() > (down ? PULSE_PROB_DOWN : PULSE_PROB)) continue;
    const hue = 215 + 55 * Math.sin(t * 0.2) + spread + (Math.random() - 0.5) * 30;
    let c;
    if (down && Math.random() < 0.3) c = hsl(hue, 0.25, 0.9);                 // pale, almost white
    else if (Math.random() < 0.1) c = hsl(325 + Math.random() * 20, 0.8, 0.66); // rare pink
    else c = hsl(hue, 0.85, 0.62);
    ev.push({ t, p: down ? 1 : 0.6 + Math.random() * 0.3, c });
  }
  return ev;
}
function chaosMask(t) {                            // 1 inside a section, linear fade-out afterwards, 0 elsewhere
  for (const [s0, s1, fe] of CHAOS_SECTIONS) {
    if (t >= s0 && t <= s1) return 1;
    if (t > s1 && t < fe) return (fe - t) / (fe - s1);
  }
  return 0;
}

/* ---- Slow dark-blue atmosphere (only on some devices) ---- */
const BLUE_START = 33.60, BLUE_END = 72.30;   // 0:33.60 - 1:12.30
const BLUE_CHANCE = 0.33;                      // share of devices lit at any given moment (every device takes part, in its own rhythm)
const BLUE_SWELL = [4.5, 9];                   // seconds a swell lasts
const BLUE_FADE_IN = 2.5, BLUE_FADE_OUT = 3.0; // seconds; it is fully dark again before the white vibration returns
const smooth01 = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
function buildBlue() {                         // a slow, out-of-phase series of dark-blue swells for this device
  const r = (lo, hi) => lo + Math.random() * (hi - lo);
  const color = () => hsl(r(206, 232), 0.95, 0.42);   // between deep navy and ocean blue
  const meanLen = (BLUE_SWELL[0] + BLUE_SWELL[1]) / 2;
  const meanGap = meanLen * (1 - BLUE_CHANCE) / BLUE_CHANCE;
  const swell = (t) => ({ t, d: r(BLUE_SWELL[0], BLUE_SWELL[1]), p: r(0.35, 0.7), c1: color(), c2: color() });
  const ev = [];
  let t = BLUE_START - Math.random() * (meanLen + meanGap);   // random phase, so devices are out of step
  while (t < BLUE_END) {
    const e = swell(t);
    if (t + e.d > BLUE_START) ev.push(e);
    t += e.d + meanGap * r(0.4, 1.6);
  }
  if (!ev.length) ev.push(swell(r(BLUE_START, BLUE_END - BLUE_SWELL[1])));   // nobody sits it out
  return ev;
}
function blueFrame(ev, t) {                    // -> { b, c } or null
  if (!ev || t < BLUE_START || t > BLUE_END) return null;
  const env = smooth01((t - BLUE_START) / BLUE_FADE_IN) * smooth01((BLUE_END - t) / BLUE_FADE_OUT);
  for (const e of ev) {
    const a = t - e.t;
    if (a < 0 || a > e.d) continue;
    const x = a / e.d, sn = Math.sin(Math.PI * x);
    return { b: env * e.p * sn * sn, c: e.c1.map((v, i) => Math.round(v + (e.c2[i] - v) * x)) };   // smooth swell, colour drifts
  }
  return null;
}
const FL_IN = 0.120, FL_PEAK = 0.050, FL_OUT = 0.450;
const quickFlash = (a) => a < -FL_IN ? 0 : a < 0 ? 1 + a / FL_IN : a < FL_PEAK ? 1 : a < FL_PEAK + FL_OUT ? 1 - (a - FL_PEAK) / FL_OUT : 0;
const FPS = 24;
const CLIP_START = 4461 / FPS;   // 185.875 s: the video frame where the fire clip starts
const CLIP_DUR   = 496 / FPS;    // 20.667 s
const CLIP_WIDTHS = [1366, 1440, 1600, 1920];
const CLIP_SRC = 'vid/fire-' + (CLIP_WIDTHS.includes(screen.width) ? screen.width : 1920) + '.mp4'; // relative path works on GitHub project pages
const FW = 45, FH = 96;          // low-res canvas; fire is drawn here and scaled to the full screen
const deviceParam = new URLSearchParams(location.search).get('device'); // ?device=pc or ?device=phone to test
const IS_COMPUTER = deviceParam ? deviceParam === 'pc' :
  !(/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) ||
    (navigator.userAgentData && navigator.userAgentData.mobile) ||
    (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)));
// Achex Cloud (https://achex.ca/develop): a free WebSocket relay. The legacy ws://achex.ca:4010 server cannot be used from an https page.
const ACHEX = { url: 'wss://cloud.achex.ca', instance: '', password: 'lightshow' };   // instance: optional, becomes wss://cloud.achex.ca/<instance>
const RTC_CFG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };            // add a TURN server here if some phones cannot connect
const TRANSPORTS = {
  peerjs:   { label: 'PeerJS (recommended)', qr: true,
              note: 'Star topology through the free PeerJS cloud broker. The most reliable choice and the one to use for large crowds.' },
  achexrtc: { label: 'Achex handshake, then WebRTC', qr: true,
              note: 'Achex only introduces the phone and the coordinator. Once the WebRTC channel is open the phone drops its WebSocket and everything runs peer to peer.' },
  achex:    { label: 'Achex relay (WebSocket)', qr: true,
              note: 'Everything goes through the free Achex Cloud relay over a normal secure WebSocket, so it also works on networks that block WebRTC. Messages pass through their server.' },
  manual:   { label: 'WebRTC, manual link exchange', manual: true,
              note: 'No server at all. Create a link for each phone and send it over any chat app. The phone sends a reply link back, and you open it on this computer.' }
};
const LATE_TOLERANCE = 0.5; // s: cues missed by more than this are skipped after a (re)sync
/* ================================ */

const $ = (s) => document.querySelector(s);
const app = $('#app');
const room = new URLSearchParams(location.search).get('room');
const VIA = TRANSPORTS[new URLSearchParams(location.search).get('via')] ? new URLSearchParams(location.search).get('via') : 'peerjs';

function startAnswerReceiver() {
  const m = location.hash.match(/a=([a-z0-9]{4})\.([A-Za-z0-9_-]+)/);
  let ok = false;
  if (m) { try { localStorage.setItem('lsa:' + m[1], m[1] + '.' + m[2]); ok = true; } catch (e) {} }   // the coordinator window listens for this
  app.innerHTML = ok
    ? '<h1>Reply received</h1><p class="sub">You can close this window now. The coordinator window finishes connecting the phone by itself.</p><p class="dim">Nothing happening? Open this link in the same browser as the coordinator, or paste it into the “reply link” box there.</p>'
    : '<h1>Could not read this link</h1><p class="sub">Paste the whole link into the “reply link” box on the coordinator instead.</p>';
}

/* ============ TRANSPORTS ============
   Every transport gives the app the same tiny interface:
   host:   hostTransport(kind, roomId, {onReady, onError, onConnect(conn), onLink?, onLinkState?}) -> Promise<{close, ...}>
           conn = { send(msg), onData, onClose }   (the host sets onData / onClose)
   client: clientTransport(kind, roomId, {onOpen, onData(msg), onClose(text, fatal), onAnswer?}) -> {send(msg), close()}      */
function hostTransport(kind, roomId, h) {
  if (kind === 'peerjs') return Promise.resolve(hostPeerJS(roomId, h));
  if (kind === 'achex') return Promise.resolve(hostAchex(roomId, h));
  if (kind === 'achexrtc') return Promise.resolve(hostAchexRTC(roomId, h));
  if (kind === 'manual') return Promise.resolve(hostManual(roomId, h));
  return Promise.reject(new Error('Unknown connection type'));
}
function clientTransport(kind, roomId, h) {
  try {
    if (kind === 'achex') return clientAchex(roomId, h);
    if (kind === 'achexrtc') return clientAchexRTC(roomId, h);
    if (kind === 'manual') return clientManual(roomId, h);
    return clientPeerJS(roomId, h);
  } catch (e) {
    setTimeout(() => h.onClose('Connection failed: ' + (e && e.message || e)), 0);
    return { send() {}, close() {} };
  }
}

/* --- PeerJS: coordinator is the hub --- */
function hostPeerJS(roomId, h) {
  const peer = new Peer(roomId);
  peer.on('open', () => h.onReady());
  peer.on('error', (e) => h.onError('PeerJS error: ' + e.type));
  peer.on('connection', (c) => {
    const conn = { send: (m) => { if (c.open) c.send(m); }, onData: null, onClose: null };
    c.on('open', () => h.onConnect(conn));
    c.on('data', (m) => conn.onData && conn.onData(m));
    const gone = () => conn.onClose && conn.onClose();
    c.on('close', gone); c.on('error', gone);
  });
  return { close: () => { try { peer.destroy(); } catch (e) {} } };
}
function clientPeerJS(roomId, h) {
  const peer = new Peer();
  let c = null;
  peer.on('open', () => {
    c = peer.connect(roomId, { reliable: true });
    c.on('open', () => h.onOpen());
    c.on('data', (m) => h.onData(m));
    c.on('close', () => h.onClose('Disconnected. Retrying…'));
  });
  peer.on('error', () => h.onClose('Connection problem. Retrying…'));
  return { send: (m) => { if (c && c.open) c.send(m); }, close: () => { try { peer.destroy(); } catch (e) {} } };
}

/* --- Achex Cloud: a plain WebSocket relay. Protocol (from achex.ca's own jquery.achex.js):
       send {"auth":name,"passwd":pw}, wait for {"auth":"OK","SID":n}; then {"toS":sid,...} reaches one session.
       Every received message carries "FROM" and "sID". Our payload travels as a JSON string in the field "ls". --- */
const achexUrl = () => ACHEX.url + (ACHEX.instance ? '/' + ACHEX.instance : '');
const achexAuthOk = (r) => r && r.auth !== undefined && String(r.auth).toLowerCase() === 'ok';
function hostAchex(roomId, h) {
  const me = 'lsh-' + roomId, conns = new Map();   // session id -> conn
  let ws = null, closed = false, ready = false, timer = null;
  const raw = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  const open = () => {
    ws = new WebSocket(achexUrl());
    ws.onopen = () => raw({ auth: me, passwd: ACHEX.password });
    ws.onmessage = (e) => {
      let r; try { r = JSON.parse(e.data); } catch (x) { return; }
      if (!ready) {
        if (achexAuthOk(r)) { ready = true; h.onReady(); }
        else if (r && r.auth !== undefined) h.onError('Achex refused the login (' + r.auth + '). If you need an instance, set ACHEX.instance in the file.');
        return;
      }
      if (!r || r.ls === undefined || r.sID === undefined) return;
      let m; try { m = JSON.parse(r.ls); } catch (x) { return; }
      let c = conns.get(r.sID);
      if (!c) {
        c = { seen: 0, onData: null, onClose: null, send: (p) => raw({ toS: r.sID, ls: JSON.stringify(p) }) };
        conns.set(r.sID, c); h.onConnect(c);
      }
      c.seen = Date.now();
      if (c.onData) c.onData(m);
    };
    ws.onclose = () => { ready = false; if (!closed) setTimeout(open, 2000); };
    ws.onerror = () => {};
  };
  open();
  // the relay does not tell us when a phone disappears, so a phone that stops pinging for 12 s counts as gone
  timer = setInterval(() => conns.forEach((c, k) => { if (Date.now() - c.seen > 12000) { conns.delete(k); if (c.onClose) c.onClose(); } }), 3000);
  return { close: () => { closed = true; clearInterval(timer); try { ws.close(); } catch (e) {} } };
}
function clientAchex(roomId, h) {
  const host = 'lsh-' + roomId, me = 'lsp-' + Math.random().toString(36).slice(2, 10);
  let ws = null, closed = false, ready = false, hostSid = null, lastHost = 0, joinTimer = null, watchdog = null;
  const raw = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  const fail = (msg) => { if (closed) return; closed = true; clearInterval(joinTimer); clearInterval(watchdog); try { ws.close(); } catch (e) {} h.onClose(msg); };
  ws = new WebSocket(achexUrl());
  ws.onopen = () => raw({ auth: me, passwd: ACHEX.password });
  ws.onmessage = (e) => {
    let r; try { r = JSON.parse(e.data); } catch (x) { return; }
    if (!ready) {
      if (achexAuthOk(r)) {
        ready = true;
        const knock = () => raw({ to: host, ls: JSON.stringify({ type: 'join' }) });   // the coordinator answers its first contact with config + state
        knock(); joinTimer = setInterval(() => { if (hostSid === null) knock(); }, 1000);
        watchdog = setInterval(() => { if (hostSid !== null && Date.now() - lastHost > 12000) fail('Coordinator stopped answering. Retrying…'); }, 3000);
      } else if (r && r.auth !== undefined) fail('Achex refused the login. Retrying…');
      return;
    }
    if (!r || r.ls === undefined || r.sID === undefined || String(r.FROM).indexOf(host) !== 0) return;
    let m; try { m = JSON.parse(r.ls); } catch (x) { return; }
    lastHost = Date.now();
    if (hostSid === null) { hostSid = r.sID; clearInterval(joinTimer); h.onOpen(); }
    h.onData(m);
  };
  ws.onclose = () => fail('Disconnected. Retrying…');
  ws.onerror = () => {};
  return { send: (m) => { if (hostSid !== null) raw({ toS: hostSid, ls: JSON.stringify(m) }); }, close: () => { closed = true; clearInterval(joinTimer); clearInterval(watchdog); try { ws.close(); } catch (e) {} } };
}


/* --- WebRTC helpers shared by "Achex handshake" and "manual link exchange" --- */
const b64u = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
function packSdp(sdp) {            // keep only what a data-channel connection needs: ICE login, DTLS fingerprint, UDP candidates
  const g = (re) => { const m = sdp.match(re); return m ? m[1].trim() : ''; };
  const fp = g(/a=fingerprint:sha-256 ([0-9A-Fa-f:]+)/);
  const cands = [...sdp.matchAll(/a=candidate:(\S+ \d+ udp \d+ \S+ \d+ typ \w+(?: raddr \S+ rport \d+)?)/gi)].map((m) => m[1]).slice(0, 5);
  const data = [g(/a=ice-ufrag:(\S+)/), g(/a=ice-pwd:(\S+)/), b64u(Uint8Array.from(fp.split(':').map((x) => parseInt(x, 16)))), g(/a=setup:(\w+)/), cands];
  return b64u(new TextEncoder().encode(JSON.stringify(data)));
}
function unpackSdp(code, setup) {  // ...and rebuild a complete session description from it
  const [u, p, f, st, cands] = JSON.parse(new TextDecoder().decode(unb64u(code)));
  const fp = [...unb64u(f)].map((x) => x.toString(16).padStart(2, '0').toUpperCase()).join(':');

    'a=ice-ufrag:' + u, 'a=ice-pwd:' + p, 'a=ice-options:trickle', 'a=fingerprint:sha-256 ' + fp, 'a=setup:' + (setup || st),

/* --- Achex handshake -> WebRTC: Achex only carries the offer/answer. Once the data channel is open the phone closes its

function hostAchexRTC(roomId, h) {
  const me = 'lsh-' + roomId, peers = new Map();                 // phone session id -> { pc, t, done }
  let ws = null, closed = false, ready = false;
  const raw = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

    const old = peers.get(sid);

    if (old) { try { old.pc.close(); } catch (e) {} }
    const pc = new RTCPeerConnection(RTC_CFG), dc = pc.createDataChannel('ls'), p = { pc, t: Date.now(), done: false };
    peers.set(sid, p);

    await pc.setLocalDescription(await pc.createOffer());

    raw({ toS: sid, ls: JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }) });
  }

    ws = new WebSocket(achexUrl());
    ws.onopen = () => raw({ auth: me, passwd: ACHEX.password });
    ws.onmessage = (e) => {
      let r; try { r = JSON.parse(e.data); } catch (x) { return; }
      if (!ready) {
        if (achexAuthOk(r)) { ready = true; h.onReady(); }
        else if (r && r.auth !== undefined) h.onError('Achex refused the login (' + r.auth + '). If you need an instance, set ACHEX.instance in the file.');
        return;
      }
      if (!r || r.ls === undefined || r.sID === undefined) return;
      let m; try { m = JSON.parse(r.ls); } catch (x) { return; }
      if (m.type === 'join') offerTo(r.sID).catch((err) => h.onError('WebRTC error: ' + (err && err.message || err)));
      else if (m.type === 'answer') { const p = peers.get(r.sID); if (p) p.pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).catch(() => {}); }
    };

    ws.onerror = () => {};

}
function clientAchexRTC(roomId, h) {
  const host = 'lsh-' + roomId, me = 'lsp-' + Math.random().toString(36).slice(2, 10);
  let ws = null, pc = null, dc = null, closed = false, ready = false, started = false, wsDone = false, knock = null;
  const raw = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  const stopWs = () => { wsDone = true; clearInterval(knock); try { ws.close(); } catch (e) {} };   // the WebSocket is only needed for the handshake
  const fail = (msg) => { if (closed) return; closed = true; stopWs(); try { pc && pc.close(); } catch (e) {} h.onClose(msg); };
  async function answer(hostSid, sdp) {
    pc = new RTCPeerConnection(RTC_CFG);
    pc.ondatachannel = (e) => {
      dc = e.channel;
      dc.onopen = () => { stopWs(); h.onOpen(); };
      dc.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (x) { return; } h.onData(m); };
      dc.onclose = () => fail('Disconnected. Retrying…');
    };
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') fail('Could not connect. Retrying…'); };
    await pc.setRemoteDescription({ type: 'offer', sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    raw({ toS: hostSid, ls: JSON.stringify({ type: 'answer', sdp: pc.localDescription.sdp }) });
  }
  ws = new WebSocket(achexUrl());
  ws.onopen = () => raw({ auth: me, passwd: ACHEX.password });
  ws.onmessage = (e) => {
    let r; try { r = JSON.parse(e.data); } catch (x) { return; }
    if (!ready) {
      if (achexAuthOk(r)) {
        ready = true;
        const ask = () => raw({ to: host, ls: JSON.stringify({ type: 'join' }) });   // "I am here": the coordinator replies with an offer
        ask(); knock = setInterval(() => { if (!started) ask(); }, 1500);
      } else if (r && r.auth !== undefined) fail('Achex refused the login. Retrying…');
      return;
    }
    if (!r || r.ls === undefined || r.sID === undefined || String(r.FROM).indexOf(host) !== 0) return;
    let m; try { m = JSON.parse(r.ls); } catch (x) { return; }
    if (m.type === 'offer' && !started) { started = true; clearInterval(knock); answer(r.sID, m.sdp).catch((err) => fail('WebRTC error: ' + (err && err.message || err))); }
  };
  ws.onclose = () => { if (!wsDone) fail('Disconnected. Retrying…'); };
  ws.onerror = () => {};
  setTimeout(() => { if (!closed && !(dc && dc.readyState === 'open')) fail('Connection timed out. Retrying…'); }, 25000);
  return { send: (m) => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(m)); }, close: () => { closed = true; stopWs(); try { pc && pc.close(); } catch (e) {} } };
}

/* --- Manual link exchange: no server at all. The coordinator makes a link (the WebRTC offer sits in the #hash), you send it
       to a phone, the phone shows a reply link (the answer in its #hash), you open that link on the coordinator's computer.
       The page that opens it stores the answer in localStorage and says it can be closed; the coordinator window sees
       the 'storage' event and finishes the handshake. Each phone needs its own link. --- */
function hostManual(roomId, h) {
  let closed = false;
  const offers = new Map();                                      // link id -> { pc, used }
  const onStorage = (e) => {
    if (!e.key || e.key.indexOf('lsa:') !== 0 || !e.newValue) return;
    try { localStorage.removeItem(e.key); } catch (x) {}
    accept(e.newValue).catch((err) => h.onError(err && err.message || String(err)));
  };
  window.addEventListener('storage', onStorage);
  async function newLink() {
    const id = Math.random().toString(36).slice(2, 6).padEnd(4, 'x');
    const pc = new RTCPeerConnection(RTC_CFG), dc = pc.createDataChannel('ls');
    offers.set(id, { pc, used: false });
    h.onLinkState(id, 'preparing');
    wireHostChannel(pc, dc, h, (s) => h.onLinkState(id, s));
    await pc.setLocalDescription(await pc.createOffer());
    await waitIce(pc);

    h.onLinkState(id, 'waiting');

  }
  async function accept(text) {                                  // a reply link, or just the part after #a=
    const s = String(text);
    const m = s.match(/a=([a-z0-9]{4})\.([A-Za-z0-9_-]+)/) || s.match(/^\s*([a-z0-9]{4})\.([A-Za-z0-9_-]+)\s*$/);
    if (!m) throw new Error('That is not a reply link from a phone.');
    const o = offers.get(m[1]);
    if (!o) throw new Error('That reply belongs to a phone link that is no longer active.');
    if (o.used) throw new Error('That reply was already used.');
    o.used = true;
    h.onLinkState(m[1], 'connecting');
    await o.pc.setRemoteDescription({ type: 'answer', sdp: unpackSdp(m[2]) });

  }

    newLink, accept,
    close: () => { closed = true; window.removeEventListener('storage', onStorage); offers.forEach((o) => { try { o.pc.close(); } catch (e) {} }); }
  };
}
function clientManual(roomId, h) {
  const m = location.hash.match(/o=([a-z0-9]{4})\.([A-Za-z0-9_-]+)/);
  if (!m) { setTimeout(() => h.onClose('This link has no connection data. Ask the coordinator for a new phone link.', true), 0); return { send() {}, close() {} }; }
  const pc = new RTCPeerConnection(RTC_CFG);
  let dc = null, done = false;
  const end = (msg) => { if (!done) { done = true; h.onClose(msg, true); } };   // a link works only once, so there is nothing to retry
  pc.ondatachannel = (e) => {
    dc = e.channel;
    dc.onopen = () => h.onOpen();
    dc.onmessage = (ev) => { let x; try { x = JSON.parse(ev.data); } catch (err) { return; } h.onData(x); };
    dc.onclose = () => end('Disconnected. Ask the coordinator for a new phone link.');
  };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') end('Could not connect. Ask the coordinator for a new phone link.'); };
  (async () => {
    await pc.setRemoteDescription({ type: 'offer', sdp: unpackSdp(m[2], 'actpass') });
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    h.onAnswer(m[1] + '.' + packSdp(pc.localDescription.sdp));
  })().catch((e) => end('Could not read the link: ' + (e && e.message || e)));
  return { send: (x) => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(x)); }, close: () => { done = true; try { pc.close(); } catch (e) {} } };
}

/* ============ COORDINATOR ============ */
function startCoordinator() {
  let id = '';
  let via = 'peerjs';
  try { const v = localStorage.getItem('via'); if (TRANSPORTS[v]) via = v; } catch (e) {}
  app.innerHTML = `
    <h1>Light show coordinator</h1>
    <p class="sub">Phones join, you pick a track, the track plays here.</p>
    <div class="panel">
      <div class="row"><span><span class="n" id="nphones">0</span> <span class="dim">phones</span></span><span><span class="n" id="ncomps">0</span> <span class="dim">computers</span></span><span class="dim">connected</span></div>
      <p id="status" class="dim">Connecting…</p>
      <label for="via">Connection type</label>
      <div class="row" style="margin:6px 0"><select id="via"></select></div>
      <p id="viaNote" class="dim" style="margin:0 0 14px;font-size:.9rem"></p>
      <div id="qr"></div>
      <p><code id="url"></code></p>
      <div id="manual" style="display:none">
        <div class="row"><button id="addLink">New phone link</button></div>
        <div id="links"></div>
        <label for="paste">Reply link from a phone (links opened in this browser are picked up automatically)</label>
        <div class="row" style="margin-top:6px"><input class="num" id="paste" style="flex:1;min-width:0" placeholder="Paste a reply link here if needed"><button class="ghost" id="pasteBtn">Connect</button></div>
      </div>
    </div>
    <div class="panel">
      <input type="file" id="file" accept="audio/*,video/*">
      <video id="audio" controls playsinline></video>
      <div class="row" style="margin-top:12px"><button class="ghost" id="fs">Fullscreen video</button></div>
    </div>
    <div class="panel">
      <label for="delay">Light delay (ms) – raise it if your speakers lag behind the lights</label>
      <div class="row"><input type="range" id="delay" min="-300" max="800" step="10" value="0" style="flex:1"><span id="delayv">0</span></div>
      <div class="row" style="margin-top:12px"><button class="ghost" id="test">Test flash</button><button class="ghost" id="resync">Resync clocks</button></div>
    </div>`;
  const audio = $('#audio');
  let idleTimer = null;                              // hide the mouse pointer over the fullscreen video until the mouse moves again
  const wakePointer = () => {
    audio.classList.remove('idle'); clearTimeout(idleTimer);
    if (document.fullscreenElement === audio || document.webkitFullscreenElement === audio) idleTimer = setTimeout(() => audio.classList.add('idle'), 1200);
  };
  audio.addEventListener('mousemove', wakePointer);
  document.addEventListener('fullscreenchange', wakePointer);
  document.addEventListener('webkitfullscreenchange', wakePointer);
  const conns = new Set();
  const kinds = new Map();   // connection -> 'phone' | 'computer'
  let compsCount = 0;   // connected computers: the fire blackout only happens when there is one
  const updateCount = () => {
    let comps = 0;
    conns.forEach((c) => { if (kinds.get(c) === 'computer') comps++; });
    $('#nphones').textContent = conns.size - comps;
    $('#ncomps').textContent = comps;
    compsCount = comps;
  };
  let delay = 0;

  /* --- connection type: dropdown, QR code and join link follow it --- */
  const viaSel = $('#via');
  Object.entries(TRANSPORTS).forEach(([k, t]) => viaSel.add(new Option(t.label, k)));
  viaSel.value = via;
  const joinUrl = () => location.origin + location.pathname + '?room=' + id + (via !== 'peerjs' ? '&via=' + via : '');
  const showJoin = () => {
    const man = !!TRANSPORTS[via].manual;
    $('#qr').innerHTML = '';
    $('#url').textContent = '';
    if (!man) {
      $('#url').textContent = joinUrl();
      try { new QRCode($('#qr'), { text: joinUrl(), width: 180, height: 180 }); } catch (e) {}
    }
    $('#manual').style.display = man ? '' : 'none';
    $('#links').innerHTML = '';
    $('#viaNote').textContent = TRANSPORTS[via].note;
  };
  const LINK_STATE = { preparing: 'Preparing…', waiting: 'Waiting for the phone’s reply link', connecting: 'Connecting…', connected: 'Connected ✓', failed: 'Connection failed, make a new link' };
  const linkRows = new Map();
  const onLink = (lid, code) => {
    const url = joinUrl() + '#o=' + code;
    const row = linkRows.get(lid) || { el: document.createElement('div') };
    row.el.className = 'row'; row.el.style.margin = '8px 0';
    row.el.innerHTML = '<span class="dim st"></span><button class="ghost cp">Copy link</button>' + (navigator.share ? '<button class="ghost sh">Share</button>' : '');
    row.el.querySelector('.cp').onclick = async (e) => {
      try { await navigator.clipboard.writeText(url); e.target.textContent = 'Copied ✓'; } catch (x) { prompt('Copy this link:', url); }
      setTimeout(() => { e.target.textContent = 'Copy link'; }, 1500);
    };
    const sh = row.el.querySelector('.sh'); if (sh) sh.onclick = () => navigator.share({ url }).catch(() => {});
    linkRows.set(lid, row); $('#links').appendChild(row.el); onLinkState(lid, 'waiting');
  };
  const onLinkState = (lid, st) => {
    let row = linkRows.get(lid);
    if (!row) { row = { el: document.createElement('div') }; row.el.className = 'row'; row.el.innerHTML = '<span class="dim st"></span>'; linkRows.set(lid, row); $('#links').appendChild(row.el); }
    row.el.querySelector('.st').textContent = LINK_STATE[st] || st;
    if (st === 'connected') row.el.querySelectorAll('button').forEach((b) => { b.style.display = 'none'; });
  };
  let current = null, token = 0;
  const attach = (conn) => {
    conns.add(conn); updateCount();
    conn.onData = (m) => {
      if (m && m.type === 'ping') conn.send({ type: 'pong', t0: m.t0, th: performance.now() });
      else if (m && m.type === 'hello') { kinds.set(conn, m.kind); updateCount(); }
    };
    conn.onClose = () => { conns.delete(conn); kinds.delete(conn); updateCount(); };
    conn.send(config()); conn.send(state());
  };
  async function startVia(switched) {
    const my = ++token;
    if (current) { try { current.close(); } catch (e) {} current = null; }
    conns.clear(); kinds.clear(); updateCount(); linkRows.clear();
    id = 'lightshow-' + Math.random().toString(36).slice(2, 7);   // a fresh room for every (re)start, so old phones can't linger in it
    showJoin();
    $('#status').textContent = 'Connecting via ' + TRANSPORTS[via].label + '…';
    try {
      const t = await hostTransport(via, id, {
        onLink: (lid, code) => { if (my === token) onLink(lid, code); },
        onLinkState: (lid, st) => { if (my === token) onLinkState(lid, st); },
        onReady: () => { if (my === token) $('#status').textContent = (switched ? 'Switched to ' + TRANSPORTS[via].label + '. Phones must rejoin with the new ' + (TRANSPORTS[via].manual ? 'links.' : 'QR code or link.') : (TRANSPORTS[via].manual ? 'Ready. Send a link to each phone.' : 'Ready. Scan the code or open the link on each phone.')); },
        onError: (msg) => { if (my === token) $('#status').textContent = msg; },
        onConnect: (conn) => { if (my === token) attach(conn); }
      });
      if (my !== token) t.close(); else current = t;
    } catch (e) {
      if (my === token) $('#status').textContent = 'Could not start ' + TRANSPORTS[via].label + ': ' + (e && e.message || e);
    }
  }

  const send = (msg) => conns.forEach((c) => c.send(msg));
  const rawT0 = () => performance.now() - audio.currentTime * 1000 / audio.playbackRate;
  // currentTime is only refreshed in chunks, so a stale read makes T0 too late, never too early.
  // Record an estimate only when currentTime actually changed and use the minimum of the recent ones.
  let est = [], lastCT = -1;
  (function tick() {
    const ct = audio.currentTime;
    audio.classList.toggle('blackout', compsCount > 0 && ct >= CLIP_START - 0.0005 && ct < CLIP_START + CLIP_DUR);
    if (audio.paused) { est = []; lastCT = -1; }
    else if (audio.currentTime !== lastCT) {
      lastCT = audio.currentTime; est.push(rawT0());
      if (est.length > 30) est.shift();
    }
    requestAnimationFrame(tick);
  })();
  const T0 = () => est.length >= 5 ? Math.min(...est) : rawT0();
  const state = () => ({ type: 'state', playing: !audio.paused && !audio.ended, T0: T0() });
  const config = () => ({ type: 'config', timestamps: TIMESTAMPS, flash: FLASH_MS, fade: FADE_MS, delay, flashes: FLASH_PEAKS });

  $('#file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) { audio.src = URL.createObjectURL(f); }
  });
  ['playing', 'pause', 'seeked', 'ended', 'ratechange'].forEach((ev) =>
    audio.addEventListener(ev, () => {
      if (ev === 'seeked' || ev === 'ratechange') { est = []; lastCT = -1; }
      send(state());
      if (ev === 'playing' || ev === 'seeked') { setTimeout(() => send(state()), 400); setTimeout(() => send(state()), 1200); }
    }));
  setInterval(() => { if (!audio.paused) send(state()); }, 2000); // drift correction

  $('#delay').addEventListener('input', (e) => {
    delay = +e.target.value; $('#delayv').textContent = delay; send(config());
  });
  $('#fs').addEventListener('click', () => (audio.requestFullscreen || audio.webkitRequestFullscreen).call(audio));
  $('#test').addEventListener('click', () => send({ type: 'test' }));
  $('#resync').addEventListener('click', () => send({ type: 'resync' }));

  viaSel.addEventListener('change', () => {
    via = viaSel.value;
    try { localStorage.setItem('via', via); } catch (e) {}
    startVia(true);
  });
  $('#addLink').addEventListener('click', () => { if (current && current.newLink) current.newLink().catch((e) => { $('#status').textContent = String(e && e.message || e); }); });
  const usePaste = async () => {
    const box = $('#paste');
    if (!current || !current.accept) return;
    try { await current.accept(box.value); box.value = ''; } catch (e) { $('#status').textContent = String(e && e.message || e); }
  };
  $('#pasteBtn').addEventListener('click', usePaste);
  startVia(false);
}

/* ============ PHONE ============ */
function startPhone(roomId) {
  app.innerHTML = `
    <h1>Light show</h1>
    <p class="sub">Keep this screen on and turn the volume of your phone off – the sound comes from the main speakers.</p>
    <button class="big" id="go">Go fullscreen &amp; start</button>
    <p id="status" class="dim">Connecting…</p>
    <div class="panel" id="answerBox" style="display:none">
      <p style="margin-top:0">Send this reply link back to the coordinator:</p>
      <div class="row"><button class="ghost" id="copyAns">Copy reply link</button><button class="ghost" id="shareAns" style="display:none">Share</button></div>
      <p><code id="ansText"></code></p>
    </div>
    <div class="panel">
      <label for="trim">Fine-tune this phone (ms, positive = later)</label>
      <div class="row"><input type="number" id="trim" value="0" step="10" style="width:6em"><span id="sync" class="dim"></span></div>
    </div>`;
  const status = (t, ok) => { const s = $('#status'); s.textContent = t; s.style.color = ok ? 'var(--ok)' : ''; };
  const light = $('#light'), ctx = light.getContext('2d');
  const clip = $('#clip');
  light.width = FW; light.height = FH;
  if (IS_COMPUTER) { clip.muted = true; clip.src = CLIP_SRC; clip.load(); }
  function updateClip(t) {
    if (!IS_COMPUTER) return;
    const ct = t === null ? -1 : t - CLIP_START;

      if (clip.paused) { clip.currentTime = ct; clip.play().catch(() => {}); }
      else if (!clip.seeking) {
        const diff = ct - clip.currentTime;                 // >0: video is behind
        if (Math.abs(diff) > 0.4) clip.currentTime = ct;    // big error: jump
        else clip.playbackRate = Math.abs(diff) < 0.03 ? 1 : 1 + Math.max(-0.1, Math.min(0.1, diff)); // small error: gently speed up/slow down
      }
    } else {
      clip.classList.remove('on');
      if (!clip.paused) clip.pause();
      if (clip.currentTime !== 0 && !clip.seeking) { clip.currentTime = 0; clip.playbackRate = 1; }
    }
  }

  let cfg = { timestamps: TIMESTAMPS, flash: FLASH_MS, fade: FADE_MS, delay: 0 };
  let offset = 0;                 // hostTime = localTime + offset
  let samples = [];               // recent {rtt, off} clock samples
  let T0 = null;                  // host-clock time at which media time was 0
  let fired = new Set();          // cues whose vibration was already triggered
  let testStart = -1e9;
  let flashOn = [], chaos = [], blue = [];
  const rollFlashes = () => { flashOn = FLASH_PEAKS.map(() => Math.random() < FLASH_CHANCE); chaos = buildChaos(); blue = buildBlue(); };
  rollFlashes();
  let link = null, ready = false, gen = 0, retryTimer = null, wakeLock = null;
  let trim = 0;
  try { trim = +localStorage.getItem('trim') || 0; $('#trim').value = trim; } catch (e) {}
  $('#trim').addEventListener('input', (e) => {
    trim = +e.target.value || 0;
    try { localStorage.setItem('trim', trim); } catch (err) {}
  });

  /* --- clock sync: keep the fastest 25% of the last 30 round trips, take their median offset --- */
  function addSample(rtt, off) {
    samples.push({ rtt, off });
    if (samples.length > 30) samples.shift();
    const best = [...samples].sort((a, b) => a.rtt - b.rtt).slice(0, Math.max(3, Math.ceil(samples.length / 4)));
    const offs = best.map((x) => x.off).sort((a, b) => a - b);
    offset = offs[Math.floor(offs.length / 2)];
    $('#sync').textContent = 'link ' + Math.round(best[0].rtt) + ' ms, ' + samples.length + ' samples';
  }
  const synced = () => samples.length >= 5;
  function ping() { if (link && ready && !document.hidden) link.send({ type: 'ping', t0: performance.now() }); }
  function burst(n = 20, spread = 400) { for (let i = 0; i < n; i++) setTimeout(ping, Math.random() * spread + i * 70); }
  setInterval(ping, 2500 + Math.random() * 1000);

  function connect() {
    if (link) { try { link.close(); } catch (e) {} }
    ready = false;
    const my = ++gen;                       // ignore late events of an old connection
    status('Connecting…');
    link = clientTransport(VIA, roomId, {
      onAnswer: (code) => {                         // manual mode: show the reply link
        if (my !== gen) return;
        const url = location.origin + location.pathname + '#a=' + code;
        $('#answerBox').style.display = ''; $('#ansText').textContent = url;
        $('#copyAns').onclick = async (e) => { try { await navigator.clipboard.writeText(url); e.target.textContent = 'Copied ✓'; } catch (x) { prompt('Copy this link:', url); } };
        if (navigator.share) { $('#shareAns').style.display = ''; $('#shareAns').onclick = () => navigator.share({ url }).catch(() => {}); }
        status('Send the reply link to the coordinator…');
      },
      onOpen: () => {
        if (my !== gen) return;
        $('#answerBox').style.display = 'none';
        ready = true; status('Connected. Tap the button.', true);
        link.send({ type: 'hello', kind: IS_COMPUTER ? 'computer' : 'phone' });
        samples = []; burst();
      },
      onData: (m) => { if (my === gen && m) onData(m); },
      onClose: (msg, fatal) => {
        if (my !== gen || retryTimer) return;
        ready = false; status(msg || 'Disconnected. Retrying…');
        if (fatal) return;                          // e.g. a manual link was used up: nothing to retry
        retryTimer = setTimeout(() => { retryTimer = null; connect(); }, 2000);
      }
    });
  }

  function onData(m) {
    if (m.type === 'pong') {
      const t1 = performance.now(), rtt = t1 - m.t0;
      addSample(rtt, m.th + rtt / 2 - t1);
    } else if (m.type === 'config') {
      cfg = m;
    } else if (m.type === 'resync') {
      samples = []; burst(20, 4000);
    } else if (m.type === 'state') {
      if (!m.playing) { T0 = null; fired.clear(); if (navigator.vibrate) navigator.vibrate(0); return; }
      if (T0 === null || Math.abs(m.T0 - T0) > 250) {   // start or seek: re-arm cues
        T0 = m.T0; fired.clear(); rollFlashes();
        const t = mediaTime();
        cfg.timestamps.forEach(([st], i) => { if (st < t - LATE_TOLERANCE) fired.add(i); });
      } else if (Math.abs(m.T0 - T0) > 40) {
        T0 = m.T0;                                      // real error: correct immediately
      } else {
        T0 += (m.T0 - T0) * 0.25;                       // smooth tiny jitter only
      }
    } else if (m.type === 'test') {
      testStart = performance.now();
    }
  }

  const mediaTime = () => (performance.now() + offset - T0 - cfg.delay - trim) / 1000;
  const env = (ageMs) => ageMs < 0 ? 0 : ageMs < cfg.flash ? 1 : ageMs < cfg.flash + cfg.fade ? 1 - (ageMs - cfg.flash) / cfg.fade : 0;

  /* --- fire (phones): classic "Doom fire" heat grid, different on every device, only start/end are shared --- */
  const heat = new Uint8Array(FW * FH);
  const img = ctx.createImageData(FW, FH);
  const pal = [];
  for (let i = 0; i <= 36; i++) {
    const f = i / 36, c = (x) => Math.max(0, Math.min(255, Math.round(x)));
    pal.push([c(f * 3 * 255), c((f - 0.33) * 3 * 255), c((f - 0.72) * 3.5 * 255)]);
  }
  let fireActive = false, fireAcc = 0, fireLast = 0;
  function fireStep(src) {
    for (let x = 0; x < FW; x++) heat[(FH - 1) * FW + x] = src;
    for (let y = 1; y < FH; y++) for (let x = 0; x < FW; x++) {
      const i = y * FW + x, v = heat[i];
      if (!v) { heat[i - FW] = 0; continue; }
      const r = (Math.random() * 3) | 0;
      heat[i - r + 1 - FW] = v - (r & 1);
    }
  }
  function drawFire(ft) {                               // ft = seconds since the fire started
    const now = performance.now();
    if (!fireActive) {
      fireActive = true; fireLast = now; heat.fill(0);
      if (ft < 0.5 && navigator.vibrate) {              // random crackle for the duration of the fire
        const pat = []; let sum = 0, total = (CLIP_DUR - ft) * 1000;
        while (sum < total) { const on = 20 + Math.random() * 90, off = 40 + Math.random() * 180; pat.push(Math.round(on), Math.round(off)); sum += on + off; }
        navigator.vibrate(pat);
      }
    }
    fireAcc += now - fireLast; fireLast = now;
    const env = Math.min(1, ft / 1.5) * Math.min(1, (CLIP_DUR - ft) / 3);  // fade in 1.5 s, die down over the last 3 s
    while (fireAcc >= 33) { fireAcc -= 33; fireStep(Math.round(36 * env)); }
    const d = img.data;
    for (let i = 0; i < heat.length; i++) { const c = pal[heat[i]], o = i * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }
    ctx.putImageData(img, 0, 0);
  }

  function frame() {
    const tNow = T0 !== null && synced() ? mediaTime() : null;
    updateClip(tNow);
    if (!IS_COMPUTER && tNow !== null && tNow >= CLIP_START && tNow < CLIP_START + CLIP_DUR) {
      drawFire(tNow - CLIP_START);
      requestAnimationFrame(frame);
      return;
    }
    fireActive = false;
    let b = 0, col = [255, 255, 255];
    if (T0 !== null && synced()) {
      const t = mediaTime();
      let last = -1;
      cfg.timestamps.forEach(([st, en], i) => {
        if (st <= t) last = st;                         // latest started cue wins (overlap cancels older fade)
        if (!fired.has(i) && st <= t) {
          fired.add(i);
          if (t - st < LATE_TOLERANCE && navigator.vibrate) navigator.vibrate(Math.max(1, Math.round((en - t) * 1000)));
        }
      });
      if (last >= 0) b = env((t - last) * 1000);        // brightness is a pure function of media time
      FLASH_PEAKS.forEach((pk, i) => {
        if (!flashOn[i]) return;
        const f = quickFlash(t - pk);
        if (f > b) { b = f; col = FLASH_COLORS[i]; }   // brightest effect decides the colour
      });
      const cm = chaosMask(t);
      if (cm > 0) for (const e of chaos) {
        const a = t - e.t;
        if (a < 0 || a > PULSE_LEN) continue;
        const f = e.p * cm * pulseEnv(a);
        if (f > b) { b = f; col = e.c; }
      }
      const bl = blueFrame(blue, t);
      if (bl && bl.b > b) { b = bl.b; col = bl.c; }
    }
    const tf = env(performance.now() - testStart);
    if (tf > b) { b = tf; col = [255, 255, 255]; }
    ctx.fillStyle = `rgb(${Math.round(col[0] * b)},${Math.round(col[1] * b)},${Math.round(col[2] * b)})`;
    ctx.fillRect(0, 0, FW, FH);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  $('#go').addEventListener('click', async () => {
    const el = document.documentElement;
    try { await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(1);        // user-gesture unlock for vibration
    if (IS_COMPUTER) clip.play().then(() => { clip.pause(); clip.currentTime = 0; }).catch(() => {}); // unlock + preload the clip
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    document.body.classList.add('running');
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('running');
  });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      burst(8);
      if (document.body.classList.contains('running')) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
    }
  });
  let lastTap = 0;                                       // double-tap the black screen to leave
  document.body.addEventListener('click', () => {
    if (!document.body.classList.contains('running')) return;
    const n = Date.now();
    if (n - lastTap < 400) { document.exitFullscreen?.(); document.body.classList.remove('running'); }
    lastTap = n;
  });

  connect();
}

/* ============ START ============ (last, so every const above is initialised before any page code runs) */
if (/[#&]a=/.test(location.hash)) startAnswerReceiver();      // someone opened a phone's reply link
else room ? startPhone(room) : startCoordinator();
</script>
</body>
</html>
