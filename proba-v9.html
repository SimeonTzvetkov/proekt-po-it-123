<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone Light Show-v1</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { color-scheme: light only; --bg:#0e0f13; --panel:#181a21; --line:#2b2e39; --text:#eceef4; --dim:#8b90a0; --accent:#fff; --ok:#6ee7a0; --bad:#ff7a7a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 20px 40px; }
  h1 { font-size:1.6rem; margin:0 0 4px; letter-spacing:-.01em; }
  p.sub { margin:0 0 24px; color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  button, input[type=file]::file-selector-button {
    font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 18px;
    background:var(--accent); color:#000; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:focus-visible, input:focus-visible { outline:2px solid #7cb7ff; outline-offset:2px; }
  .big { width:100%; padding:20px; font-size:1.2rem; }
  audio { width:100%; margin-top:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dim { color:var(--dim); }
  #qr { background:#fff; padding:10px; border-radius:8px; display:inline-block; }
  #qr:empty { display:none; }
  code { word-break:break-all; font-size:.85rem; color:var(--dim); }
  #count { font-weight:700; font-size:1.4rem; }
  #status { min-height:1.5em; }
  /* phone light */
  #light { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; display:none; z-index:10; forced-color-adjust:none; }
  body.running #light { display:block; }
  body.running .wrap { visibility:hidden; }
  body.running { background:#000; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto; } }
</style>
</head>
<body>
<canvas id="light" width="1" height="1"></canvas>
<div class="wrap" id="app"></div>

<script>
/* ============ CONFIG ============ */
const TIMESTAMPS = [
  [10.255, 12.385],
  [12.980, 14.935],
  [15.562, 17.519],
  [18.145, 19.220],
  [19.433, 19.970],
  [20.715, 22.699],
  [23.304, 25.260],
  [25.885, 27.840],
  [28.466, 29.745]
];
const FLASH_MS = 50;      // full brightness
const FADE_MS  = 1950;    // then fade to black
const LATE_TOLERANCE = 0.5; // s: cues missed by more than this are skipped after a (re)sync
/* ================================ */

const $ = (s) => document.querySelector(s);
const app = $('#app');
const room = new URLSearchParams(location.search).get('room');
room ? startPhone(room) : startCoordinator();

/* ============ COORDINATOR ============ */
function startCoordinator() {
  const id = 'lightshow-' + Math.random().toString(36).slice(2, 7);
  const joinUrl = location.origin + location.pathname + '?room=' + id;
  app.innerHTML = `
    <h1>Light show coordinator</h1>
    <p class="sub">Phones join, you pick a track, the track plays here.</p>
    <div class="panel">
      <div class="row"><span id="count">0</span><span class="dim">phones connected</span></div>
      <p id="status" class="dim">Connecting to PeerJS…</p>
      <div id="qr"></div>
      <p><code id="url"></code></p>
    </div>
    <div class="panel">
      <input type="file" id="file" accept="audio/*,video/*">
      <audio id="audio" controls></audio>
    </div>
    <div class="panel">
      <label for="delay">Light delay (ms) – raise it if your speakers lag behind the lights</label>
      <div class="row"><input type="range" id="delay" min="-300" max="800" step="10" value="0" style="flex:1"><span id="delayv">0</span></div>
      <div class="row" style="margin-top:12px"><button class="ghost" id="test">Test flash</button></div>
    </div>`;
  $('#url').textContent = joinUrl;

  const audio = $('#audio');
  const conns = new Set();
  let delay = 0;
  const peer = new Peer(id);

  peer.on('open', () => {
    $('#status').textContent = 'Ready. Scan the code or open the link on each phone.';
    try { new QRCode($('#qr'), { text: joinUrl, width: 180, height: 180 }); } catch (e) {}
  });
  peer.on('error', (e) => { $('#status').textContent = 'PeerJS error: ' + e.type; });

  const send = (msg) => conns.forEach((c) => c.open && c.send(msg));
  const T0 = () => performance.now() - audio.currentTime * 1000 / audio.playbackRate;
  const state = () => ({ type: 'state', playing: !audio.paused && !audio.ended, T0: T0() });
  const config = () => ({ type: 'config', timestamps: TIMESTAMPS, flash: FLASH_MS, fade: FADE_MS, delay });

  peer.on('connection', (c) => {
    c.on('open', () => {
      conns.add(c);
      $('#count').textContent = conns.size;
      c.send(config());
      c.send(state());
    });
    c.on('data', (m) => {
      if (m && m.type === 'ping') c.send({ type: 'pong', t0: m.t0, th: performance.now() });
    });
    const gone = () => { conns.delete(c); $('#count').textContent = conns.size; };
    c.on('close', gone); c.on('error', gone);
  });

  $('#file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) { audio.src = URL.createObjectURL(f); }
  });
  ['play', 'pause', 'seeked', 'ended', 'ratechange'].forEach((ev) =>
    audio.addEventListener(ev, () => send(state())));
  setInterval(() => { if (!audio.paused) send(state()); }, 2000); // drift correction

  $('#delay').addEventListener('input', (e) => {
    delay = +e.target.value; $('#delayv').textContent = delay; send(config());
  });
  $('#test').addEventListener('click', () => send({ type: 'test' }));
}

/* ============ PHONE ============ */
function startPhone(roomId) {
  app.innerHTML = `
    <h1>Light show</h1>
    <p class="sub">Keep this screen on and turn the volume of your phone off – the sound comes from the main speakers.</p>
    <button class="big" id="go">Go fullscreen &amp; start</button>
    <p id="status" class="dim">Connecting…</p>`;
  const status = (t, ok) => { const s = $('#status'); s.textContent = t; s.style.color = ok ? 'var(--ok)' : ''; };
  const light = $('#light'), ctx = light.getContext('2d');

  let cfg = { timestamps: TIMESTAMPS, flash: FLASH_MS, fade: FADE_MS, delay: 0 };
  let offset = 0, bestRtt = Infinity;   // hostTime = localTime + offset
  let T0 = null;                         // host-clock time at which media time was 0
  let fired = new Set();
  let flashStart = -1e9;                 // local performance.now() of the latest flash
  let conn = null, wakeLock = null;

  function connect() {
    const peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(roomId, { reliable: true });
      conn.on('open', () => { status('Connected. Tap the button.', true); bestRtt = Infinity; ping(); });
      conn.on('data', onData);
      conn.on('close', () => { status('Disconnected. Retrying…'); setTimeout(() => { peer.destroy(); connect(); }, 1500); });
    });
    peer.on('error', () => { status('Connection problem. Retrying…'); setTimeout(() => { peer.destroy(); connect(); }, 2000); });
  }
  function ping() { if (conn && conn.open) conn.send({ type: 'ping', t0: performance.now() }); }
  setInterval(ping, 3000);

  function onData(m) {
    if (m.type === 'pong') {
      const t1 = performance.now(), rtt = t1 - m.t0;
      if (rtt <= bestRtt * 1.2 || bestRtt === Infinity) { // keep low-latency samples
        if (rtt < bestRtt) bestRtt = rtt;
        offset = m.th + rtt / 2 - t1;
      }
    } else if (m.type === 'config') {
      cfg = m;
    } else if (m.type === 'state') {
      if (!m.playing) { T0 = null; fired.clear(); stopAll(); return; }
      const newT0 = m.T0 - offset + offset; // host-clock value; kept in host domain
      if (T0 === null || Math.abs(newT0 - T0) > 250) { // start or seek: re-arm cues
        T0 = newT0; fired.clear();
        const t = mediaTime();
        cfg.timestamps.forEach(([s], i) => { if (s < t - LATE_TOLERANCE) fired.add(i); });
      } else {
        T0 = newT0; // small drift correction
      }
    } else if (m.type === 'test') {
      flash(0);
    }
  }

  const mediaTime = () => (performance.now() + offset - T0 - cfg.delay) / 1000;

  function flash(vibMs) {
    flashStart = performance.now(); // new flash cancels the previous fade
    if (vibMs > 0 && navigator.vibrate) navigator.vibrate(vibMs);
  }
  function stopAll() { flashStart = -1e9; if (navigator.vibrate) navigator.vibrate(0); }

  function frame() {
    if (T0 !== null) {
      const t = mediaTime();
      cfg.timestamps.forEach(([s, e], i) => {
        if (!fired.has(i) && t >= s) {
          fired.add(i);
          if (t - s < LATE_TOLERANCE) flash(Math.max(0, Math.round((e - t) * 1000)));
        }
      });
    }
    const age = performance.now() - flashStart;
    let b = 0;
    if (age >= 0 && age < cfg.flash + cfg.fade) b = age < cfg.flash ? 1 : 1 - (age - cfg.flash) / cfg.fade;
    const v = Math.round(b * 255);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(0, 0, 1, 1);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  $('#go').addEventListener('click', async () => {
    const el = document.documentElement;
    try { await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(1); // user-gesture unlock for vibration
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    document.body.classList.add('running');
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('running');
  });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && document.body.classList.contains('running')) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  });
  // tap the black screen twice quickly to leave
  let lastTap = 0;
  light.parentElement.addEventListener('dblclick', () => {});
  document.body.addEventListener('click', () => {
    if (!document.body.classList.contains('running')) return;
    const n = Date.now(); if (n - lastTap < 400) document.exitFullscreen?.(), document.body.classList.remove('running'); lastTap = n;
  });

  connect();
}
</script>
</body>
</html>
